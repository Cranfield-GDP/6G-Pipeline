services:
    oai-flexric:
        image: oaisoftwarealliance/oai-flexric:develop
        privileged: true
        container_name: oai-flexric
        networks:
            public_net:
                ipv4_address: 192.168.70.150
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
            # - sharedXappLibs:/usr/local/lib/flexric/
            - ./ric/xapp_py:/usr/local/flexric/xApp/python3_dev
        healthcheck:
            test: /bin/bash -c "pgrep nearRT-RIC"
            interval: 10s
            timeout: 5s
    # br-flexric:
    #     image: br_flexric:local
    #     privileged: true
    #     container_name: br-flexric
    #     networks:
    #         public_net:
    #             ipv4_address: 192.168.70.150
    #     volumes:
    #         - ./ric/ric.conf:/usr/local/etc/flexric/ric.conf
    #         - ./ric/xapp_py:/usr/local/flexric/xApp/python3_dev
    #     # command: sleep infinity
    #     healthcheck:
    #         test: /bin/bash -c "pgrep nearRT-RIC"
    #         interval: 10s
    #         timeout: 5s
    oai-gnb:
        image: oaisoftwarealliance/oai-gnb:develop
        privileged: true
        container_name: oai-gnb
        environment:
            USE_ADDITIONAL_OPTIONS: --sa -E --rfsim --log_config.global_log_options level,nocolor,time
        networks:
            public_net:
                ipv4_address: 192.168.70.141
            public_net_access:
                ipv4_address: 192.168.72.141
        volumes:
            - ./conf/gnb.sa.band78.106prb.rfsim.flexric.conf:/opt/oai-gnb/etc/gnb.conf
            - ./conf/channelmod_rfsimu.conf:/opt/oai-gnb/etc/channelmod_rfsimu.conf
        healthcheck:
            test: /bin/bash -c "pgrep nr-softmodem"
            interval: 10s
            timeout: 5s
            retries: 5
    oai-nr-ue-1:
        image: oaisoftwarealliance/oai-nr-ue:develop
        privileged: true
        container_name: oai-nr-ue-1
        environment: 
            USE_ADDITIONAL_OPTIONS: -E --rfsim -r 106 --numerology 1 --uicc0.imsi 208950000000031 -C 3619200000 --rfsimulator.serveraddr 192.168.70.141 --log_config.global_log_options level,nocolor,time
        networks:
            public_net:
                ipv4_address: 192.168.70.142
        volumes:
            - ./conf/ue.conf:/opt/oai-nr-ue/etc/nr-ue.conf
        healthcheck:
            test: /bin/bash -c "pgrep nr-uesoftmodem"
            interval: 10s
            timeout: 5s
            retries: 5
    oai-nr-ue-2:
        image: oaisoftwarealliance/oai-nr-ue:develop
        privileged: true
        container_name: oai-nr-ue-2
        environment: 
            USE_ADDITIONAL_OPTIONS: -E --rfsim -r 106 --numerology 1 --uicc0.imsi 208950000000032 -C 3619200000 --rfsimulator.serveraddr 192.168.70.141 --log_config.global_log_options level,nocolor,time
        networks:
            public_net:
                ipv4_address: 192.168.70.143
        volumes:
            - ./conf/ue.conf:/opt/oai-nr-ue/etc/nr-ue.conf
        healthcheck:
            test: /bin/bash -c "pgrep nr-uesoftmodem"
            interval: 10s
            timeout: 5s
            retries: 5

# volumes:
#     sharedXappLibs:

networks:
    public_net:
        name: demo-oai-public-net
        external: true
    public_net_access:
        name: oai-public-access
        external: true
